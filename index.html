<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joker Esen</title>
    <meta name="description" content="Bienvenue chez Joker Esen, le club étudiant festif et créatif de l'ESEN (Tunisie) fondé en 2016. Événements, vie étudiante, teambuilding et communauté passionnée !" />
    
    <!-- Resource Hints: Preconnect to Critical Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Preload Critical LCP Hero Background Image with Cloudinary Auto-Format -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/qvnoo1cy/image/upload/f_auto,q_auto,w_1920,c_limit/v1788313989/background-image.png"
      fetchpriority="high"
    />

    <!-- Non-Blocking Google Fonts with font-display: swap -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel+Decorative:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <!-- Asynchronous Non-Blocking Custom Display Fonts from CDNFonts -->
    <link rel="preload" href="https://fonts.cdnfonts.com/css/groste" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://fonts.cdnfonts.com/css/lemon-tea" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://fonts.cdnfonts.com/css/fluctuation" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://fonts.cdnfonts.com/css/utendo" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://fonts.cdnfonts.com/css/kg-red-hands" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://fonts.cdnfonts.com/css/sunny-spells" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  </head>
  <body class="bg-[#1A0E14] text-[#F5EDE4] antialiased selection:bg-[#B93A34] selection:text-white overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
